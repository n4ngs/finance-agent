<!DOCTYPE html>
<html>
<head>
    <title>Connect Bank - Personal CFO</title>
    <style>
        body { font-family: system-ui; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 50px auto; }
        h1 { color: #333; }
        .status { margin-top: 20px; padding: 20px; background: #f0f0f0; border-radius: 8px; }
        a { color: #667eea; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Connect Your Bank</h1>
        <div id="status" class="status">
            <p>Getting ready...</p>
        </div>
    </div>

    <script>
        const API_BASE = (window.opener && window.opener.location.origin) || window.location.origin || 'https://finance-agent-production-694c.up.railway.app';

        async function init() {
            try {
                const status = document.getElementById('status');
                status.innerHTML = '<p>Fetching Plaid link token...</p>';

                // Get link token from backend
                const res = await fetch(`${API_BASE}/api/plaid/link-token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: 'user_' + Math.random().toString(36).substr(2, 9) })
                });

                const data = await res.json();

                if (!data.link_token) {
                    status.innerHTML = `<p style="color: red;">Error: ${data.error || 'No link token'}</p>`;
                    return;
                }

                // Redirect to Plaid's hosted Link with token
                status.innerHTML = '<p>Redirecting to Plaid...</p>';
                window.location.href = `https://sandbox.plaid.com/link?token=${encodeURIComponent(data.link_token)}`;

            } catch (e) {
                document.getElementById('status').innerHTML = `<p style="color: red;">Error: ${e.message}</p>`;
            }
        }

        // Start immediately
        init();
    </script>
</body>
</html>
